name: .NET EF Migration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ef-migrations:
    name: EF Migrations and DB seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:latest
        env:
          POSTGRES_USER: smartnotes_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartnotes_db
        options: >-
          --health-cmd "pg_isready -h postgres -U smartnotes_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install EF CLI
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.1

      - name: Wait for Postgres
        run: |
          until pg_isready -h postgres -p 5432 -U postgres; do
            sleep 1
          done

      - name: Restore packages
        run: dotnet restore SmartNotes.Api/SmartNotes.Api.csproj

      - name: Apply EF migrations
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet ef database update \
            --project SmartNotes.Api/SmartNotes.Api.csproj \
            --startup-project SmartNotes.Api/SmartNotes.Api.csproj \
            --context SmartNotesDbContext \
            --connection "Host=postgres;Port=5432;Database=smartnotes_db;Username=smartnotes_user;Password=password"

      - name: Verify database tables
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet ef migrations list --project SmartNotes.Api/SmartNotes.Api.csproj --startup-project SmartNotes.Api/SmartNotes.Api.csproj
